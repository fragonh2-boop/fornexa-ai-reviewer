services:
  - type: web
    name: fornexa-ai-reviewer
    runtime: node
    plan: free
    healthCheckPath: /
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_REQUEST_TIMEOUT_MS
        value: "180000"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CHANNEL_ID
        value: C0BT661FYLW
      - key: SLACK_AGENT_LABEL
        value: DEEPSEEK
      - key: SLACK_MENTIONS_ENABLED
        value: "false"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: fragonh2-boop
      - key: GITHUB_REPO
        value: Fornexa
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      - key: STALE_LOCK_MINUTES
        value: "15"
