services:
  - type: web
    name: fornexa-ai-reviewer
    runtime: node
    plan: free
    healthCheckPath: /
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_REQUEST_TIMEOUT_MS
        value: "180000"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CHANNEL_ID
        value: C0BT661FYLW
      - key: SLACK_AGENT_LABEL
        value: DEEPSEEK
      - key: SLACK_MENTIONS_ENABLED
        value: "false"
      - key: SLACK_ALLOWED_BOT_IDS
        value: "B0C39QX9PEY,U0C362TR8HG"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: fragonh2-boop
      - key: GITHUB_REPO
        value: Fornexa
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      - key: STALE_LOCK_MINUTES
        value: "15"
  - type: web
    name: fornexa-gpt-bridge
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm run start:gpt-bridge
    autoDeployTrigger: "off"
    envVars:
      # The bridge starts inert. Activation is a separate, staged operation
      # after the dedicated bot identity and Slack Events URL are verified.
      - key: SLACK_AGENT_NETWORK_ENABLED
        value: "false"
      - key: SLACK_CHANNEL_ID
        value: C0BT661FYLW
      - key: SLACK_AGENT_LABEL
        value: GPT
      # Dedicated FornexaGPT app only; values are entered in Render and never
      # committed. The bridge verifies user_id + bot_id with auth.test.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_USER_ID
        sync: false
      - key: SLACK_BOT_ID
        sync: false
      - key: SLACK_AGENT_NETWORK_PEERS
        sync: false
      - key: MESH_CONTROL_TOKEN
        sync: false
      # Controlador central opcional: sus secretos se configuran solo en
      # Render y quedan fuera de Git, Slack y los servicios de los modelos.
      - key: MESH_CONTROLLER_ENABLED
        value: "false"
      - key: MESH_CONTROLLER_TOKEN
        sync: false
      - key: MESH_CONTROLLER_ORIGIN_URLS
        sync: false
      - key: MESH_CONTROLLER_ORIGIN_TOKENS
        sync: false
  # Identidad propia de Grok. Mismo código que el reviewer; solo cambia el
  # proveedor de modelo y las credenciales de Slack. Nace en autoDeployTrigger
  # "off" y con la mención desactivada por defecto: se activa en un paso
  # separado, después de verificar la app de Slack y su Events URL.
  - type: web
    name: fornexa-grok-reviewer
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: "off"
    envVars:
      - key: AI_PROVIDER
        value: grok
      # Secreto de xAI (console.x.ai). Se introduce en Render, nunca en Git.
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.7
      - key: SLACK_CHANNEL_ID
        value: C0BT661FYLW
      - key: SLACK_AGENT_LABEL
        value: GROK
      # App de Slack propia (GrokFornexa). El servicio verifica user_id y
      # bot_id con auth.test: un token de otra IA no arranca esta identidad.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_USER_ID
        sync: false
      - key: SLACK_BOT_ID
        sync: false
      # @Grok en #fornexa inicia una conversación. Requiere app_mentions:read
      # y la Events URL apuntando a este servicio.
      - key: SLACK_MENTIONS_ENABLED
        value: "false"
      # Identidades de bot autorizadas a pedirle revisión a Grok. Se rellena en
      # Render con los IDs reales (Gemini, DeepSeek, Claude, GPT); sin wildcards.
      - key: SLACK_REVIEW_ALLOWED_BOT_IDS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: fragonh2-boop
      - key: GITHUB_REPO
        value: Fornexa
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      - key: STALE_LOCK_MINUTES
        value: "15"
